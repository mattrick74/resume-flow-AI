# Used only for developer CLI commands such as:
#   .venv\Scripts\alembic revision --autogenerate -m "describe change"
# The running sidecar migrates programmatically (resumeflow/db/migrate.py).

[alembic]
script_location = resumeflow/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///./alembic-dev.db
