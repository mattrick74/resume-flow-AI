[project]
name = "resumeflow-backend"
version = "1.8.6"
description = "ResumeFlow AI local sidecar: candidate profiles, job matching, document generation."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "keyring>=25",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "pymupdf>=1.24",
  "openai>=3.31",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
package = ["pyinstaller>=6.10"]

[project.scripts]
resumeflow-backend = "resumeflow.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resumeflow*"]

[tool.setuptools.package-data]
"resumeflow.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
